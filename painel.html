<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Painel Admin - RotaCliente
    </title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<header class="topbar">

    <div class="logo">
        Rota<span>Cliente</span>
    </div>

    <nav class="menu">

        <a href="index.html">
            Cadastro
        </a>

        <a href="pesquisa.html">
            Pesquisa
        </a>

        <a href="painel.html">
            Painel
        </a>

    </nav>

</header>

<main class="container">

    <section class="welcome-card">

        <div>

            <h1>
                Dashboard Admin
            </h1>

            <p class="slogan">
                Controle total do sistema.
            </p>

        </div>

        <p id="usuarioLogado"></p>

    </section>

    <!-- CARDS -->

    <section class="dashboard-grid">

        <div class="dashboard-card">

            <h3>
                Clientes
            </h3>

            <p id="totalClientes">
                0
            </p>

        </div>

        <div class="dashboard-card">

            <h3>
                Usuários
            </h3>

            <p id="totalUsuarios">
                0
            </p>

        </div>

        <div class="dashboard-card">

            <h3>
                Pendentes
            </h3>

            <p id="totalPendentes">
                0
            </p>

        </div>

    </section>

    <!-- USUÁRIOS -->

    <section class="card">

        <h2>
            Aprovar Usuários
        </h2>

        <div id="listaUsuarios">

            <p class="vazio">
                Carregando...
            </p>

        </div>

    </section>

</main>

<script type="module"
        src="painel.js">
</script>

</body>
</html>
