<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - RotaCliente</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <div class="logo">
        📍 Rota<span>Cliente</span>
    </div>

</header>

<main class="container">

    <section class="card">

        <h1>Cadastrar Motorista</h1>

        <p class="slogan">
            Solicite acesso ao sistema.
        </p>

        <form id="formCadastroUsuario">

            <div class="campo">
                <label>Nome</label>
                <input type="text" id="nome" required>
            </div>

            <div class="campo">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="campo">
                <label>Senha</label>
                <input type="password" id="senha" required>
            </div>

            <button class="btn-salvar" type="submit">
                Cadastrar
            </button>

        </form>

        <div style="margin-top:15px; text-align:center;">

            <p>
                Já possui conta?
            </p>

            <a href="login.html">
                Fazer login
            </a>

        </div>

    </section>

</main>

<script type="module" src="cadastro.js"></script>

</body>
</html>
